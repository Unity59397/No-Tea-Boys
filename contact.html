<section id="contact">
  <div class="contact-grid">
    <div>
      <div class="eyebrow">Get in touch</div>
      <h1 class="page-head-inline">Say something.</h1>
      <p class="contact-lede">Feel like telling us off or wanting to give us a message?   We <em>mostly</em> read everything.</p>
      <div class="contact-links">
        <a href="mailto:casleanurenato@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></svg>
          casleanurenato@gmail.com
        </a>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M8 9h8M8 15h5"/></svg>
          Discord — join the table
        </a>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 5.8c-.7.3-1.5.5-2.3.6.8-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.6 1a4 4 0 0 0-6.9 3.6A11.4 11.4 0 0 1 3.7 4.6a4 4 0 0 0 1.3 5.4c-.6 0-1.3-.2-1.8-.5v.1a4 4 0 0 0 3.3 4 4 4 0 0 1-1.8.1 4 4 0 0 0 3.8 2.8A8.1 8.1 0 0 1 2 18.4a11.4 11.4 0 0 0 6.2 1.8c7.4 0 11.5-6.2 11.5-11.5v-.5c.8-.6 1.5-1.3 2.3-2.4Z"/></svg>
          @noteaboys
        </a>
      </div>
    </div>
    <form class="contact-form">
      <div class="row2">
        <div>
          <label for="c-name">Name</label>
          <input type="text" id="c-name" placeholder="Your name">
        </div>
        <div>
          <label for="c-email">Email</label>
          <input type="email" id="c-email" placeholder="you@example.com">
        </div>
      </div>
      <div>
        <label for="c-msg">Message</label>
        <textarea id="c-msg" placeholder="What's brewing?"></textarea>
      </div>
      <button type="button" class="btn btn-primary">Send message</button>
    </form>
  </div>
</section>
<footer>
